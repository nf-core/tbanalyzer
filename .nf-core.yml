nf_core_version: 4.0.2
repository_type: pipeline
lint:
  files_unchanged:
    - .pre-commit-config.yaml
  nextflow_config:
    # MTBseq reference-data paths legitimately use ${projectDir}; their resolved
    # absolute value can never equal a portable nextflow_schema.json default.
    - config_defaults:
        - params.mtbseq_ref_and_indexes_path
        - params.mtbseq_resilist
        - params.mtbseq_intregions
        - params.mtbseq_categories
        - params.mtbseq_basecalib
  # The pipeline wraps non-deterministic tools (BWA/GATK via MTBseq); the default
  # nf-test asserts success + key-output existence instead of content snapshots.
  nf_test_content: false
template:
  author: "@abhi18av"
  description: TB-GVAS aims to democratize analysis by providing a comprehensive and
    user-friendly toolkit for genomic characterization of Mycobacterium tuberculosis
    (Mtb) pathogens at the species and strain levels
  force: false
  is_nfcore: true
  name: tbanalyzer
  org: nf-core
  outdir: .
  version: 1.0dev
